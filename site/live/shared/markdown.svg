<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Markdown source on the left, and the page roc-markdown renders from it on the right">
  <rect width="400" height="300" fill="#ece6d8"/>
  <!-- the source, as typed -->
  <rect x="16" y="40" width="168" height="220" rx="6" fill="#2b2733"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#e8e6e0">
    <text x="28" y="70"><tspan fill="#c792ea"># </tspan>Hello, Roc</text>
    <text x="28" y="100">Plain <tspan fill="#f78c6c">**bold**</tspan> and</text>
    <text x="28" y="116"><tspan fill="#f78c6c">*italic*</tspan>, with</text>
    <text x="28" y="132"><tspan fill="#c3e88d">`code`</tspan> and a</text>
    <text x="28" y="148"><tspan fill="#82aaff">[link](roc)</tspan>.</text>
    <text x="28" y="178"><tspan fill="#c792ea">- </tspan>pure functions</text>
    <text x="28" y="194"><tspan fill="#c792ea">- </tspan>bytes in,</text>
    <text x="28" y="210">  HTML out</text>
    <text x="28" y="240" fill="#9a968c">&lt;script&gt; stays text</text>
  </g>
  <!-- the package between them -->
  <circle cx="200" cy="150" r="17" fill="#5b3ea8"/>
  <path d="M192 150 L207 150 M201 143 L208 150 L201 157" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the page it renders -->
  <rect x="216" y="40" width="168" height="220" rx="6" fill="#fffdf7" stroke="#d8d0bf"/>
  <g font-family="system-ui, sans-serif" fill="#1d1d1b">
    <text x="230" y="72" font-size="17" font-weight="bold">Hello, Roc</text>
    <text x="230" y="102" font-size="12">Plain <tspan font-weight="bold">bold</tspan> and</text>
    <text x="230" y="118" font-size="12" font-style="italic">italic<tspan font-style="normal">, with</tspan></text>
    <rect x="229" y="124" width="36" height="14" rx="3" fill="#ece6d8"/>
    <text x="232" y="135" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace">code</text>
    <text x="270" y="135" font-size="12">and a</text>
    <text x="230" y="151" font-size="12" fill="#1f5fa8" text-decoration="underline">link</text>
    <text x="256" y="151" font-size="12">.</text>
    <text x="232" y="181" font-size="12">• pure functions</text>
    <text x="232" y="197" font-size="12">• bytes in, HTML out</text>
    <text x="230" y="240" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#6b6860">&lt;script&gt; stays text</text>
  </g>
</svg>
