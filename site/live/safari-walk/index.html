<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safari Walk</title>
<link rel="icon" href="data:,">
<style>
html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 15px sans-serif; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; }
#message { display: none; position: absolute; inset: 0; padding: 2em; box-sizing: border-box; text-align: center; align-content: center; line-height: 1.5; }
#message button { margin-top: 1em; font: inherit; padding: 0.4em 1.2em; }
#loading { position: absolute; inset: 0; background: #000; text-align: center; align-content: center; line-height: 1.6; pointer-events: none; transition: opacity 1.2s; }
#loading small { color: #999; }
#rate { display: none; position: absolute; top: 8px; left: 8px; padding: 4px 8px; background: rgba(0, 0, 0, 0.55); color: #eee; font: 13px monospace; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<!-- sokol_app finds the canvas by its default selector, #canvas. -->
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="loading"><span id="stage">Downloading the walk (about 7 MB)</span><br><small id="clock"></small></div>
<div id="message"></div>
<div id="rate"></div>
<script src="rocco.js"></script>
<script>
// The loading line says which stage the page is in, and stays up until the
// frames come steadily, so the walk is moving when it shows. The stages:
// the download, then the engine preparing the trees and the sky's light,
// then the browser readying the GPU's shaders for the first frames.
(function () {
	var stage = document.getElementById("stage");
	var clock = document.getElementById("clock");
	var loading = document.getElementById("loading");
	var start = performance.now();
	var done = false;
	var ticking = setInterval(function () {
		clock.textContent = Math.round((performance.now() - start) / 1000) + " s";
	}, 250);

	function finish() {
		if (done) return;
		done = true;
		clearInterval(ticking);
		loading.style.opacity = "0";
		setTimeout(function () { loading.style.display = "none"; }, 1300);
	}

	// index.wasm and index.data are the two big files. Once both are in,
	// the engine decodes the meshes and filters the skies.
	var waiting = { "index.wasm": true, "index.data": true };
	function arrived(entries) {
		entries.forEach(function (entry) {
			delete waiting[entry.name.split("/").pop()];
		});
		if (!done && Object.keys(waiting).length === 0) {
			stage.textContent = "Preparing the trees and the light of the sky";
		}
	}
	try {
		new PerformanceObserver(function (list) { arrived(list.getEntries()); }).observe({ type: "resource", buffered: true });
	} catch (error) {
		console.error(error);
	}

	// After the first frame, wait for 20 frames in a row each under 100 ms,
	// or 15 seconds, whichever comes first.
	window.addEventListener("rocco:ready", function () {
		stage.textContent = "Starting the walk";
		var steady = 0;
		var last = performance.now();
		var ready = last;
		function tick(now) {
			steady = now - last < 100 ? steady + 1 : 0;
			last = now;
			if (steady >= 20 || now - ready > 15000) finish(); else requestAnimationFrame(tick);
		}
		requestAnimationFrame(tick);
	});

	window.rocco_message = function (text) {
		finish();
		loading.style.display = "none";
		var box = document.getElementById("message");
		box.textContent = text;
		box.style.display = "block";
		document.getElementById("canvas").style.display = "none";
		return box;
	};
})();
// The F key shows or hides the frame rate over the last second of frames
// (at least the last frame), and the longest of them. It is the page's own
// count of animation frames, so it costs the game nothing, and nothing
// while hidden.
(function () {
	var rate = document.getElementById("rate");
	var shown = false;
	var last = 0;
	var gaps = [];
	function tick(now) {
		if (!shown) return;
		if (last > 0) gaps.push(now - last);
		last = now;
		var sum = gaps.reduce(function (a, b) { return a + b; }, 0);
		while (gaps.length > 1 && sum - gaps[0] >= 1000) sum -= gaps.shift();
		if (gaps.length > 0) {
			var fps = gaps.length * 1000 / sum;
			rate.textContent = (fps < 10 ? fps.toFixed(1) : Math.round(fps)) + " fps, longest frame " + Math.round(Math.max.apply(null, gaps)) + " ms";
		}
		requestAnimationFrame(tick);
	}
	window.addEventListener("keydown", function (event) {
		if (event.code !== "KeyF" || event.repeat) return;
		shown = !shown;
		rate.style.display = shown ? "block" : "none";
		last = 0;
		gaps = [];
		if (shown) { rate.textContent = "counting frames"; requestAnimationFrame(tick); }
	}, true);
})();
window.addEventListener("rocco:unsupported", function (event) { rocco_message(event.detail.message); });
window.addEventListener("rocco:stopped", function (event) { rocco_message(event.detail.message); });
window.addEventListener("rocco:ready", function () {
	// A headless browser shows nothing, so a check reads the console instead.
	console.log("The game is ready.");
});
// The engine dispatches rocco:quit after a Quit Command or the Bridge's quit
// has ended the run. A restart needs a fresh page.
window.addEventListener("rocco:quit", function () {
	console.log("The game has ended.");
	var box = rocco_message("The game has ended.");
	var again = document.createElement("button");
	again.textContent = "Play again";
	again.onclick = function () { location.reload(); };
	box.appendChild(document.createElement("br"));
	box.appendChild(again);
});
rocco_start();
</script>
</body>
</html>
