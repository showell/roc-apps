# Build the canvas apps as Windows executables and upload them as one artifact.
#
# This runs on a hosted Windows runner because Roc's x64win link is MSVC-ABI and
# looks for an installed Windows SDK, which a Linux box cannot provide. The
# steps follow roc-ray's own CI: its pinned zig and Roc nightly, then `zig build`
# for the host libraries. Run by hand:
#
#   gh workflow run windows.yml
#   gh run download <run-id> -n windows-exe -D ~/build/roc-apps/ray/windows
#
# Its inputs say which roc-ray, which Roc nightly and which apps; unset, the
# ones this repository builds with. A probe of a newer pair names them:
#
#   gh workflow run windows.yml -f roc_ray_ref=<commit> -f roc_nightly=nightly-<date>-<sha> -f apps=snake
#
# Every app under canvas_apps/ is built. ray/fetch_exes.sh is what pulls them
# from the build box to a Windows machine.
#
# **THE TWO CHECKOUTS ARE SIBLINGS**, because canvas_apps/<name>/main.roc
# names roc-ray as `../../../roc-ray` in its own source rather than through a
# variable, and nothing stages or rewrites that path.
name: Windows executables

on:
  workflow_dispatch:
    inputs:
      roc_ray_ref:
        description: "roc-ray's commit"
        default: e100c9548b903ee5c7363f5997251980c4355c7b
      roc_nightly:
        description: "the Roc nightly (roc-nightly.txt's, as setup-roc names it)"
        default: nightly-2026-09-22-e494788
      apps:
        description: "the apps to build, space-separated"
        default: snake pong breakout camera workshop particles safari trick_or_treat
      opt:
        description: "Roc's --opt: speed (LLVM), or dev (the backend roc-ray's own CI builds Windows with)"
        default: speed

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout roc-apps
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: roc-apps

      - name: Checkout roc-ray
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lukewilliamboswell/roc-ray
          ref: ${{ inputs.roc_ray_ref }}
          path: roc-ray

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Install Roc
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          # The nightly in roc-nightly.txt, which every build script here
          # reads, unless the run names another.
          nightly-tag: ${{ inputs.roc_nightly }}

      # ReleaseFast: a plain `zig build` is a Debug host, whose checked
      # arithmetic and resource-heap checks took a third of Safari's frame.
      - name: Build roc-ray's host libraries
        working-directory: roc-ray
        run: zig build -Doptimize=ReleaseFast

      # The canvas apps compile where they are written, so `native.sh` takes no
      # roc-ray variable: the sibling checkout above is what makes it resolve.
      - name: Build the canvas apps
        working-directory: roc-apps
        env:
          ROC: roc
          OUT: out
          TARGET: x64win
          OPT: ${{ inputs.opt }}
          APPS: ${{ inputs.apps }}
        run: |
          for app in $APPS; do
            canvas_apps/native.sh "$app"
          done

      # No window: the headless host draws nothing, so this proves each
      # executable links, loads and runs its cycles.
      - name: Run them headless
        working-directory: roc-apps
        env:
          APPS: ${{ inputs.apps }}
        run: |
          for app in $APPS; do
            "out/$app/$app.exe" --host-headless --host-headless-frames=3
          done

      - name: Upload the executables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-exe
          path: roc-apps/out/*/*.exe
          if-no-files-found: error
