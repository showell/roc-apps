# Build the roc-ray apps as Windows executables and upload them as an artifact.
#
# This runs on a hosted Windows runner because Roc's x64win link is MSVC-ABI and
# looks for an installed Windows SDK, which a Linux box cannot provide. The
# steps follow roc-ray's own CI: its pinned zig and Roc nightly, then `zig build`
# for the host libraries. Run by hand:
#
#   gh workflow run windows.yml
#   gh run download <run-id> -n windows-exe -D ~/build/roc-apps/ray/windows
name: Windows executables

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout roc-apps
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout roc-ray
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lukewilliamboswell/roc-ray
          ref: e100c9548b903ee5c7363f5997251980c4355c7b
          path: roc-ray

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Install Roc
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: nightly-2026-09-07-14d9829

      # ReleaseFast: a plain `zig build` is a Debug host, whose checked
      # arithmetic and resource-heap checks took a third of Safari's frame.
      - name: Build roc-ray's host libraries
        working-directory: roc-ray
        run: zig build -Doptimize=ReleaseFast

      - name: Build the apps
        env:
          ROC: roc
          ROC_RAY: roc-ray
          OUT: out
          TARGET: x64win
        run: |
          ray/build.sh hello
          OPT=speed ray/build.sh safari

      # No window: the headless host draws nothing, so this proves each
      # executable links, loads and runs its cycles (Safari paints every one).
      - name: Run the apps headless
        run: |
          out/hello/hello.exe --host-headless --host-headless-frames=5
          out/safari/safari.exe --host-headless --host-headless-frames=3

      - name: Upload the executables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-exe
          path: out/*/*.exe
          if-no-files-found: error

      # The runner exposes only Microsoft's OpenGL 1.1, which raylib cannot use;
      # Mesa's llvmpipe opengl32.dll beside the executable gives it GL 3.3 on the
      # CPU, as roc-ray's own CI does. Pinned so what CI draws cannot move.
      - name: Install Mesa software OpenGL
        env:
          MESA_VERSION: 24.3.4
        run: |
          curl -fsSL -o mesa.7z \
            "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VERSION}/mesa3d-${MESA_VERSION}-release-msvc.7z"
          7z e -y mesa.7z -oout/safari x64/opengl32.dll x64/libgallium_wgl.dll x64/libglapi.dll
          rm mesa.7z

      # Safari in a real hidden window, the keys scripted by cycle: at four
      # places on the route it pauses and saves the frame three ways, the
      # anti-aliased Shapes painter (P), plain Shapes (A, P, A), and the Pixels
      # painter (R, P, R).
      - name: Screenshots, both painters
        working-directory: out/safari
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          ./safari.exe --host-frames=190 --host-hidden --host-caps-allow-all \
            --host-keys=5:J,8:J,11:J,14:P,17:A,20:P,23:A,26:R,29:P,32:R,35:J,38:J,41:J,44:P,47:A,50:P,53:A,56:R,59:P,62:R,65:SPACE,105:SPACE,108:P,111:A,114:P,117:A,120:R,123:P,126:R,129:J,132:J,135:J,138:J,141:J,144:J,147:J,150:J,153:J,156:P,159:A,162:P,165:A,168:R,171:P,174:R
          ls -l shots

      - name: Upload the screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safari-shots
          path: out/safari/shots/*.png
          if-no-files-found: error
