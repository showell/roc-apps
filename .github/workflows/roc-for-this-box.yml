# A roc compiler this box can run, built on a runner instead of here.
#
# **WHY THIS EXISTS.** Since roc-lang/roc a02ff3b0ce the x86_64 Linux release
# computes type digests with the CPU's SHA-256 instructions, and `sha` is in the
# release build's CPU floor, so every nightly from 2026-09-12 on dies with
# SIGILL on this box the first time it digests a type (docs/roc-notes.md). The
# only compiler that runs here is one built with `src/base/sha256_rounds.zig`
# forced onto the portable rounds, which produce the same digest bytes.
#
# Building one here costs the box's single core for a long time. A runner has
# more of them and does not care, so this builds it there and hands back a
# binary to drop in.
#
#   gh workflow run roc-for-this-box.yml -f ref=reloc-order-pr
#   gh run download <run-id> -n roc-linux-x64      # into ~/build/roc/fast/bin/
#
# The edit this makes is NEVER committed anywhere: it is wrong for any machine
# with the extension, and roc's own `minici` refuses a build without it for good
# reason. It is applied to a checkout the runner throws away.
name: roc for this box

on:
  workflow_dispatch:
    inputs:
      repo:
        description: the roc checkout to build
        default: showell/roc
      ref:
        description: the branch, tag or sha
        default: reloc-order-pr
      optimize:
        description: zig optimize mode
        default: ReleaseFast
        type: choice
        options: [ReleaseFast, ReleaseSafe, Debug]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}

      - uses: xyzzylabs/setup-zig@09d85d9dbb73308882e7a26e61a8f706eed40df1 # ratchet:xyzzylabs/setup-zig@v1.0.2
        with:
          version: 0.16.0
          use-cache: true

      # The portable rounds, so the binary runs on a CPU with no SHA extension.
      # Both constants have to move: the first stops the hardware rounds being
      # required, the second says this target is allowed to use the software
      # ones (upstream allows it for x86_64 macOS alone).
      - name: Force the portable SHA-256 rounds
        run: |
          set -eu
          f=src/base/sha256_rounds.zig
          python3 - "$f" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          s, n = re.subn(
              r"pub const hasHardwareSupport = switch \(arch_class\) \{.*?\n\};",
              "pub const hasHardwareSupport = false; // built for a CPU with no SHA extension",
              s, count=1, flags=re.S)
          assert n == 1, "hasHardwareSupport not found; upstream changed it"
          s, n = re.subn(
              r"pub const uses_software_rounds = .*?;\n",
              "pub const uses_software_rounds = arch_class == .x86_64;\n",
              s, count=1, flags=re.S)
          assert n == 1, "uses_software_rounds not found; upstream changed it"
          open(p, "w").write(s)
          PY
          git --no-pager diff --stat "$f"

      - name: Build
        run: |
          time zig build roc -Doptimize=${{ inputs.optimize }} --prefix "$PWD/out"
          ls -la out/bin/roc
          out/bin/roc --version

      # A smoke test, and only that: the binary type-checks a program without
      # dying. It is what catches the two ways this build goes wrong -- a
      # compile error from TypeDigestHasher's @compileError, and the SIGILL a
      # stock build gives on a CPU with no SHA extension. It does NOT check that
      # the portable rounds and the hardware rounds agree; that is upstream's
      # own code path and upstream's own tests.
      - name: Type-check a program with it
        run: |
          set -eu
          printf 'module [twice]\n\ntwice : I64 -> I64\ntwice = |n| n * 2\n' > /tmp/Smoke.roc
          out/bin/roc check /tmp/Smoke.roc

      - uses: actions/upload-artifact@v4
        with:
          name: roc-linux-x64
          path: out/bin/roc
          retention-days: 14
          compression-level: 9
