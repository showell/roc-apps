<!doctype html>
<meta charset="utf-8">
<title>plasma in Roc (Codex kernel, CPU dispatch)</title>
<style>
  html,body { margin:0; background:#05060c; color:#8aa; font:13px system-ui,sans-serif; }
  #wrap { display:flex; flex-direction:column; align-items:center; gap:8px; padding:10px; }
  canvas { border:1px solid #182a4a; }
  #status { opacity:.7; }
</style>
<div id="wrap">
  <canvas id="c" width="1024" height="768"></canvas>
  <div id="status">loading plasma.wasm...</div>
</div>
<script type="module">
// The same kernel as Cobblestone's apps/gpushow/web/plasma.html, ported from
// Codex to Roc (PlasmaKernel.roc) and run on the CPU: renderFrame(n) fills
// W*H packed 0xRRGGBB words in wasm memory, and this puts them on a 2d
// canvas. No WebGPU, so no secure context is needed.
const W = 1024, H = 768, N = W * H;
const status = document.getElementById('status');
const { instance } = await WebAssembly.instantiateStreaming(fetch('plasma.wasm'), {});
const x = instance.exports;
const ctx = document.getElementById('c').getContext('2d');
const img = ctx.createImageData(W, H);
const px = new Uint32Array(img.data.buffer);
let frame = 0, ms = 0;
function tick() {
  const t0 = performance.now();
  const bytes = x.renderFrame(frame);
  const src = new Uint32Array(x.memory.buffer, x.bufPtr(), bytes / 4);
  for (let i = 0; i < N; i++) {
    const c = src[i];
    px[i] = 0xff000000 | ((c & 255) << 16) | (c & 0xff00) | (c >>> 16);
  }
  ctx.putImageData(img, 0, 0);
  ms = ms * 0.9 + (performance.now() - t0) * 0.1;
  frame++;
  status.textContent = `Roc-ported Codex kernel, CPU dispatch -- ${(N / 1000) | 0}k threads, frame ${frame}, ${ms.toFixed(1)} ms`;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
